{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>Список публичных моментов</h1>

    <div class="list-group">
      {% if moments %}
      {% for moment in moments %}
        <a href="{% url 'moment:moment_detail' moment.pk %}" class="list-group-item list-group-item-action">
            {{ moment.title }}
        </a>
      {% endfor %}
    </div>
  {% else %}
  <p> У вас пока нет моментов</p>
  {% endif %}

</div>
{% endblock %}
