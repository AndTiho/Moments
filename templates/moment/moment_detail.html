{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-rose-100 via-pink-50 to-violet-100 flex items-center justify-center p-6">
  <div class="card w-full max-w-md rounded-[2rem] border border-white/40 bg-white/70 shadow-xl backdrop-blur-md">
    <div class="card-body p-8">
      <div class="mb-3 flex items-center gap-2">
        <span class="inline-block h-3 w-3 rounded-full bg-rose-300"></span>
        <span class="inline-block h-3 w-3 rounded-full bg-pink-200"></span>
        <span class="inline-block h-3 w-3 rounded-full bg-violet-200"></span>
      </div>

      <h2 class="text-2xl font-bold text-rose-700">Летний момент</h2>
      <p class="mt-2 leading-relaxed text-slate-600">
        Солнце пробивалось сквозь листву, ветер шевелил волосы, и мир будто
        на секунду стал очень тихим и очень добрым.
      </p>

      <div class="mt-5 flex flex-wrap gap-2">
        <span class="rounded-full bg-rose-100 px-3 py-1 text-sm text-rose-700">нежность</span>
        <span class="rounded-full bg-pink-100 px-3 py-1 text-sm text-pink-700">тишина</span>
        <span class="rounded-full bg-violet-100 px-3 py-1 text-sm text-violet-700">природа</span>
      </div>

      <div class="mt-6 flex gap-3">
        <button class="rounded-2xl bg-rose-400 px-5 py-3 font-medium text-white shadow-md transition hover:-translate-y-0.5">
          Читать
        </button>
        <button class="rounded-2xl border border-rose-200 bg-white/70 px-5 py-3 font-medium text-rose-600 transition hover:bg-rose-50">
          Сохранить
        </button>
      </div>
    </div>
  </div>
</div>
{% endblock %}
