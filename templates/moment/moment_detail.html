{% extends "base.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
    <div class="card shadow-lg border-0 w-100"
         style="max-width: 520px; border-radius: 2rem; background: linear-gradient(135deg, #312e81, #581c87, #0f172a); color: white;">
        <div class="card-body p-4 p-md-5">

            <h2 class="card-title mb-3" style="color: #ddd6fe;">
                {{ moment.title }}
            </h2>

            <p class="card-text mb-4" style="color: rgba(255,255,255,0.75);">
                {{ moment.details }}
            </p>

            <div class="mb-4">
                <span class="badge rounded-pill me-2" style="background-color: rgba(255,255,255,0.15);">луна</span>
                <span class="badge rounded-pill me-2" style="background-color: rgba(255,255,255,0.15);">тишина</span>
                <span class="badge rounded-pill" style="background-color: rgba(255,255,255,0.15);">магия</span>
            </div>
            <div class="row justify-content-center mt-4">
                <div class="col-10 col-sm-8 col-md-6">
                    <div class="d-grid gap-2">
                        <a href="{% url 'moment:moment_update' moment.pk %}"
                           class="btn"
                           style="background-color: rgba(139, 92, 246, 0.85); color: white; border-radius: 1rem;">
                            Редактировать
                        </a>

                        <a href="{% url 'moment:moment_delete' moment.pk %}"
                           class="btn"
                           style="background-color: rgba(239, 68, 68, 0.8); color: white; border-radius: 1rem;">
                            Удалить
                        </a>

                        <a href="{% url 'moment:home' %}"
                           class="btn"
                           style="background-color: rgba(195, 75, 154, 0.85); color: white; border-radius: 1rem;">
                            На главную
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
