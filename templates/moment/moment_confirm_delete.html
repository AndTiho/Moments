{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md
                rounded-[2rem]
                bg-base-100/30 backdrop-blur-md
                shadow-md
                p-6
                text-center
                space-y-5">

        <h2 class="nature-title text-xl">
            Удалить момент?
        </h2>

        <p class="text-base-content/70 leading-relaxed">
            Ты действительно хочешь удалить момент
            <strong class="text-base-content">«{{ moment.title }}»</strong>?
        </p>

        <form method="post" class="w-full">
            {% csrf_token %}

            <div x-data="{ confirm: false }" class="space-y-3">

                <template x-if="!confirm">
                    <button type="button"
                            @click="confirm = true"
                            class="btn w-full rounded-full px-6
                                   border border-rose-200/50
                                   bg-gradient-to-r from-rose-100/60 to-orange-100/50
                                   text-base-content shadow-md transition
                                   hover:-translate-y-1 hover:shadow-lg
                                   hover:border-rose-200/70
                                   hover:from-rose-100/80 hover:to-orange-100/70">
                        Да, удалить
                    </button>
                </template>

                <template x-if="confirm">
                    <div class="space-y-3">
                        <p class="text-sm text-base-content/60">
                            Точно удалить? Уничтожаем тот самый момент?
                        </p>

                        <button type="submit"
                                class="btn w-full rounded-full px-6
                                       border border-rose-200/50
                                       bg-gradient-to-r from-rose-100/80 to-orange-100/70
                                       text-base-content shadow-md transition
                                       hover:-translate-y-1 hover:shadow-lg">
                            Да, уничтожаем
                        </button>
                    </div>
                </template>

                <a href="{% url 'moment:moment_detail' moment.pk %}"
                   class="btn w-full rounded-full px-6
                          border border-base-content/10
                          bg-base-100/45
                          text-base-content
                          shadow-sm transition
                          hover:-translate-y-1 hover:shadow-md
                          hover:bg-base-100/60">
                    Отмена
                </a>

            </div>
        </form>

    </div>
</div>
{% endblock %}
