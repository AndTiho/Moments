<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магия ✨</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

<!-- ВСТАВЬ СЮДА МОЮ КАРТОЧКУ -->
<div class="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 flex items-center justify-center p-6">
  <div class="max-w-md w-full rounded-[2rem] bg-white/10 backdrop-blur-xl border border-white/20 shadow-2xl p-8 text-white">

    <h2 class="text-2xl font-semibold text-violet-200">
      Ночная тишина
    </h2>

    <p class="mt-3 text-white/70 leading-relaxed">
      Луна тихо наблюдала, как мир засыпает…
      а я оставалась в этом мгновении чуть дольше, чем нужно.
    </p>

    <div class="mt-5 flex gap-2 text-sm">
      <span class="bg-white/10 px-3 py-1 rounded-full">луна</span>
      <span class="bg-white/10 px-3 py-1 rounded-full">тишина</span>
      <span class="bg-white/10 px-3 py-1 rounded-full">магия</span>
    </div>

    <button class="mt-6 w-full py-3 rounded-2xl bg-violet-500/80 hover:bg-violet-400 transition shadow-lg">
      Погрузиться
    </button>

  </div>
</div>

</body>
</html>
