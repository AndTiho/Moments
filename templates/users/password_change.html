{% extends "base.html" %}

{% block content %}
<section class="max-w-4xl mx-auto px-4 py-10">
    <div class="max-w-2xl mb-6">
        <h1 class="nature-title text-3xl md:text-4xl">
            Сменить пароль
        </h1>
        <p class="text-base-content/60 mt-2">
            Иногда полезно обновить границы.
        </p>
    </div>

    <div class="rounded-[2rem] bg-base-100/30 backdrop-blur-md shadow-md p-6 md:p-8 max-w-md">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            {% if form.non_field_errors %}
            <div class="alert alert-error">
                <span>{{ form.non_field_errors.0 }}</span>
            </div>
            {% endif %}

            <div class="space-y-2">
                <label for="{{ form.old_password.id_for_label }}" class="text-sm font-medium">
                    Старый пароль
                </label>
                {{ form.old_password }}
            </div>

            <div class="space-y-2">
                <label for="{{ form.new_password1.id_for_label }}" class="text-sm font-medium">
                    Новый пароль
                </label>
                {{ form.new_password1 }}
            </div>

            <div class="space-y-2">
                <label for="{{ form.new_password2.id_for_label }}" class="text-sm font-medium">
                    Подтверждение
                </label>
                {{ form.new_password2 }}
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-2">
                <button type="submit"
                        class="btn rounded-full border border-emerald-200/60 bg-gradient-to-r from-emerald-200/60 to-teal-200/60 text-base-content shadow-md transition hover:shadow-lg hover:-translate-y-1 hover:border-emerald-300 hover:from-emerald-300/70 hover:to-teal-300/70 hover:bg-gradient-to-r">
                    Сохранить
                </button>

                <a href="{% url 'users:profile' pk=request.user.pk %}"
                   class="btn btn-ghost w-full sm:w-auto rounded-full transition hover:shadow-lg hover:-translate-y-1">
                    Отмена
                </a>
            </div>
        </form>
    </div>
</section>
{% endblock %}
